name: Build AntherChat APK

on:
  push:
    branches:
      - main
      - master
      - sc
  pull_request:
    branches:
      - main
      - master
      - sc
  workflow_dispatch: # Allows manual trigger from GitHub Actions web tab
  release:
    types: [published]

jobs:
  build:
    name: Build AntherChat Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :vector-app:assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntherChat-Release-APK
          path: vector-app/build/outputs/apk/**/release/*.apk
          retention-days: 7

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :vector-app:assembleRelease --no-daemon

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vector-app/build/outputs/apk/**/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

